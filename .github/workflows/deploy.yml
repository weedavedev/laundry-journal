name: Build and Deploy Site
on:
  push:
    branches: 
      - main
      - svelte_frontend
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      
      # Check which branch triggered the workflow
      - name: Check branch
        id: check_branch
        run: |
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
      
      # If on svelte_frontend branch, get content from main
      - name: Get content from main branch if needed
        if: steps.check_branch.outputs.branch == 'svelte_frontend'
        uses: actions/checkout@v4
        with:
          ref: main
          path: temp-main
          sparse-checkout: |
            content
          sparse-checkout-cone-mode: false
      
      - name: Copy content if on svelte_frontend branch
        if: steps.check_branch.outputs.branch == 'svelte_frontend'
        run: |
          mkdir -p content
          cp -r temp-main/content/* ./content/
      
      # Setup and build
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Copy Content to UI
        run: |
          # Determine the correct source path based on branch
          if [[ "${{ steps.check_branch.outputs.branch }}" == "main" ]]; then
            SOURCE_PATH="./content"
          else
            SOURCE_PATH="./content"
          fi
          
          mkdir -p ui/src/content
          cp -r ${SOURCE_PATH}/*.md ui/src/content/
      
      - name: Install Dependencies
        working-directory: ./ui
        run: npm ci
      
      - name: Ensure paths in svelte.config.js
        working-directory: ./ui
        run: |
          # Create or update lib/config.js with base path
          mkdir -p src/lib
          echo "export const BASE_PATH = '/laundry-journal';" > src/lib/config.js
          
          # Check if svelte.config.js exists and update it
          if [ -f "svelte.config.js" ]; then
            # Make a backup
            cp svelte.config.js svelte.config.js.bak
            
            # Check if paths.base is already in the config
            if grep -q "paths:" svelte.config.js && grep -q "base:" svelte.config.js; then
              # Update the existing base path
              sed -i "s|base:.*|base: '/laundry-journal',|" svelte.config.js
            else
              # Add paths.base to the config
              sed -i "/kit:.*{/a \ \ \ \ paths: { base: '/laundry-journal' }," svelte.config.js
            fi
          fi
      
      - name: Build Svelte App
        working-directory: ./ui
        run: npm run build
        env:
          BASE_PATH: '/laundry-journal'
      
      - name: Create .nojekyll file
        run: touch ui/build/.nojekyll
      
      - name: Create 404.html for SPA routing
        run: |
          cat > ui/build/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting...</title>
            <script>
              // Redirect to the root with the path as a query parameter
              const segment = window.location.pathname.replace('/laundry-journal/', '');
              window.location.href = '/laundry-journal/?path=' + encodeURIComponent(segment);
            </script>
          </head>
          <body>
            Redirecting...
          </body>
          </html>
          EOF
          
          # Add redirect handling to index.html
          if [ -f "ui/build/index.html" ]; then
            sed -i '/<head>/a \
            <script>\
              // Handle redirects from 404.html\
              const urlParams = new URLSearchParams(window.location.search);\
              const redirectPath = urlParams.get("path");\
              if (redirectPath) {\
                // Remove the query parameter\
                window.history.replaceState(null, null, "/laundry-journal/" + redirectPath);\
              }\
            </script>' ui/build/index.html
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './ui/build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
