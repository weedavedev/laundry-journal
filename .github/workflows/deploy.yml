name: Build and Deploy Site
on:
  push:
    branches: 
      - main
      - svelte_frontend
    paths:
      - 'content/**'
      - 'ui/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: svelte_frontend
      
      # If triggered from main branch content change, sync content
      - name: Check if triggered by main branch content
        id: check_trigger
        run: |
          REF_NAME="${{ github.ref_name }}"
          echo "triggered_by_main=$([[ $REF_NAME == 'main' ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
      
      - name: Get content from main branch if needed
        if: steps.check_trigger.outputs.triggered_by_main == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          path: temp-main
          sparse-checkout: |
            content
          sparse-checkout-cone-mode: false
      
      - name: Copy content if from main branch
        if: steps.check_trigger.outputs.triggered_by_main == 'true'
        run: |
          mkdir -p content
          cp -r temp-main/content/* ./content/
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/
          git commit -m "Update content from main branch" || echo "No changes to commit"
          git push
      
      # Normal build process now proceeds
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Copy Content to UI
        run: mkdir -p ui/src/content && cp -r content/*.md ui/src/content/
      
      - name: Install Dependencies
        working-directory: ./ui
        run: npm ci
      
      - name: Build Svelte App
        working-directory: ./ui
        run: npm run build
        env:
          BASE_PATH: '/laundry-journal'
      
      - name: Create .nojekyll file
        run: touch ui/build/.nojekyll
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './ui/build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
